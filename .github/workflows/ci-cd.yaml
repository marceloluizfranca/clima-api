name: ci-cd

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  imagem:
    needs: testes
    if: github.event_name == 'push'
    # Os nós do kind são arm64, então a imagem é construída nativamente em ARM
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: imagem
    # Runner self-hosted dentro do cluster kind (scale set do ARC)
    runs-on: arc-splic
    concurrency: deploy-splic
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - name: Aplica os manifests com a imagem deste commit
        run: |
          # O kubectl usa a ServiceAccount do pod do runner, sem kubeconfig
          TAG="sha-${GITHUB_SHA::7}"
          cat >> k8s/kustomization.yaml <<FIM
          images:
            - name: ${IMAGEM}
              newTag: ${TAG}
          FIM
          kubectl apply -k k8s/
      - name: Aguarda o rollout
        run: kubectl -n clima rollout status deployment/clima-api --timeout=180s
